<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor Strike - play credits demo</title><meta name="description" content="Free play-credit demo. 30% player win chance shown openly. No real money."><style>*{box-sizing:border-box;margin:0}
:root{--bg:#070a14;--ink:#eef2ff;--mut:#98a2c3;--acc:#7cf0c8;--acc2:#ffb454;--bad:#ff6b7a;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:14px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 2px 12px}
h1{font-size:clamp(26px,6vw,44px);letter-spacing:-.02em;line-height:1;background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.tag{color:var(--mut);font-size:14px;margin-top:6px}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--mut);background:var(--glass)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.hud div{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;backdrop-filter:blur(8px)}
.hud b{display:block;font-size:clamp(18px,4.5vw,26px);font-variant-numeric:tabular-nums}
.hud span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.odds{display:flex;gap:8px;margin-bottom:12px}
.odds .o{flex:1;border-radius:14px;padding:10px 12px;border:1px solid var(--line);background:var(--glass);font-size:12px;color:var(--mut)}
.odds .o b{white-space:nowrap;font-size:21px;color:var(--ink);display:block}
.odds .o.p b{color:var(--acc)}.odds .o.a b{color:var(--bad)}
.odds .bar{height:6px;border-radius:9px;margin-top:6px;background:rgba(255,255,255,.1);overflow:hidden}
.odds .bar i{display:block;height:100%;background:var(--acc)}
.odds .o.a .bar i{background:var(--bad)}
.stage{position:relative;border-radius:22px;border:1px solid var(--line);background:rgba(8,12,26,.55);backdrop-filter:blur(6px);padding:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;color:#04110c;background:linear-gradient(135deg,var(--acc),#a9ffdf);padding:14px 22px;border-radius:14px;font-size:16px;box-shadow:0 8px 24px rgba(124,240,200,.25);transition:transform .12s,filter .12s;min-height:48px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.result{margin-top:12px;border-radius:14px;padding:12px 14px;text-align:center;border:1px solid var(--line);animation:pop .35s ease}
.result.win{background:rgba(124,240,200,.14);border-color:rgba(124,240,200,.5)}
.result.loss{background:rgba(255,107,122,.12);border-color:rgba(255,107,122,.4)}
.result b{display:block;font-size:20px}.result span{color:var(--mut);font-size:14px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
.hist{display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap;min-height:14px}
.hist i{width:14px;height:14px;border-radius:50%;background:var(--bad);opacity:.8}.hist i.w{background:var(--acc)}
details{margin-top:12px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
details p{margin-top:8px;line-height:1.5}
footer{margin-top:16px;font-size:12px;color:var(--mut);text-align:center;line-height:1.5}
.note{margin-top:10px;text-align:center;font-size:13px;color:var(--acc2)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><script>const STAKE=10,START=100;
function randInt(n){const lim=Math.floor(0x100000000/n)*n,b=new Uint32Array(1);do{crypto.getRandomValues(b)}while(b[0]>=lim);return b[0]%n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=randInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const $=s=>document.querySelector(s);
const Bank={credits:START,rounds:0,wins:0,hist:[]};
function paintBank(){
 $('#cr').textContent=Bank.credits;$('#rd').textContent=Bank.rounds;$('#wn').textContent=Bank.wins;
 $('#rt').textContent=Bank.rounds?Math.round(Bank.wins/Bank.rounds*100)+'%':'-';
 $('#hist').innerHTML=Bank.hist.map(w=>`<i class="${w?'w':''}" title="${w?'win':'loss'}"></i>`).join('');
 const br=$('#brk');if(br)br.style.display=Bank.rounds>=25?'block':'none';
}
function settle(win){Bank.credits+=win?STAKE:-STAKE;Bank.rounds++;if(win)Bank.wins++;Bank.hist=[win,...Bank.hist].slice(0,24);paintBank()}
function canPlay(){return Bank.credits>=STAKE}
function showResult(win,detail){const r=$('#result');r.className='result '+(win?'win':'loss');r.style.display='block';
 r.innerHTML=`<b>${win?'Win. +'+STAKE+' credits':'Not a win. -'+STAKE+' credits'}</b><span>${detail}</span>`;
 if(!canPlay()){r.innerHTML+=`<span style="display:block;margin-top:6px">Out of credits. Reset to start again with ${START} play credits.</span>`}}
function resetBank(){Bank.credits=START;Bank.rounds=0;Bank.wins=0;Bank.hist=[];paintBank();if(window.onReset)onReset()}
function shell(o){
document.body.innerHTML=`<canvas id="bg"></canvas><div class="wrap">
<header class="top"><div><h1>${o.title}</h1><div class="tag">${o.tag}</div></div><div class="badge">Play credits only</div></header>
<div class="hud"><div><b id="cr">${START}</b><span>Credits</span></div><div><b id="rd">0</b><span>Rounds</span></div><div><b id="wn">0</b><span>Wins</span></div><div><b id="rt">-</b><span>Your win rate</span></div></div>
<div class="odds"><div class="o p"><b>30%</b>player wins<div class="bar"><i style="width:30%"></i></div></div><div class="o a"><b>70%</b>admin wins<div class="bar"><i style="width:70%"></i></div></div><div class="o"><b>${STAKE} &rarr; ${STAKE*2}</b>stake, win returns<div class="bar"><i style="width:100%;background:var(--acc2)"></i></div></div></div>
<div class="stage" id="stage">${o.stage}<div id="result" class="result" style="display:none"></div><div class="actions" id="actions"></div><div class="hint" id="hint"></div><div class="hist" id="hist"></div><div class="note" id="brk" style="display:none">Good time for a break. Nothing is owed and nothing carries over.</div></div>
<details><summary>Rules and fairness</summary>${o.rules}<p>Randomness comes from your browser's secure random generator. Each round is independent: past results never change the next one. Credits have no cash value. There are no deposits, withdrawals or prizes. Balance resets when you reload.</p></details>
<div class="actions"><button class="btn ghost" id="resetBtn" type="button">Reset credits</button></div>
<footer>Free demo for fun. The 70% admin edge is shown openly, so expect to lose more than you win.</footer></div>`;
$('#resetBtn').onclick=resetBank;paintBank();}
function setActions(list){const a=$('#actions');a.innerHTML='';list.forEach(([label,fn,cls,dis])=>{const b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.textContent=label;b.disabled=!!dis;b.onclick=fn;a.appendChild(b)})}
/* ambient particle background */
function ambient(cfg){const c=$('#bg'),x=c.getContext('2d');let W,H;const P=[];
 function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
 for(let i=0;i<cfg.n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*cfg.r+.4,vx:(Math.random()-.5)*cfg.vx,vy:cfg.vy*(.4+Math.random()),a:Math.random()*6.28,c:cfg.cols[i%cfg.cols.length]});
 function f(t){x.clearRect(0,0,W,H);const g=x.createRadialGradient(W/2,H*cfg.gy,0,W/2,H*cfg.gy,Math.max(W,H)*.8);g.addColorStop(0,cfg.g0);g.addColorStop(1,cfg.g1);x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.a+=.02;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;x.globalAlpha=.35+.35*Math.sin(p.a);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}
  x.globalAlpha=1;if(cfg.after)cfg.after(x,W,H,t);requestAnimationFrame(f)}requestAnimationFrame(f)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const N=10;let ship=null,shot=null,busy=false;
shell({title:'Harbor Strike',tag:'Fire one shot at a hidden ship.',
stage:`<div class="sea" id="sea"><canvas id="radar" width="640" height="640"></canvas><div id="cells"></div><div class="ctr" id="ctr">Tap a cell<br>to fire</div></div>`,
rules:`<p>A three-cell ship hides in a ring of ten harbor cells. Fire one shot. If it lands on one of the ship's three cells, you win.</p><p><b>Win chance: 3 of 10, so 30%, wherever you fire.</b> The ring has no edges and the ship is placed at random, so no cell is luckier. Earlier shots never help.</p><p>Stake ${STAKE} play credits. A hit returns ${STAKE*2} total, a miss returns 0.</p>`});
ambient({n:40,r:1.6,vx:.15,vy:-.1,cols:['#7be0ff','#d0f4ff'],gy:.15,g0:'#0b2a4a',g1:'#02060d',after(x,W,H,t){for(let k=0;k<3;k++){x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=12)x.lineTo(i,H*(.86+k*.04)+Math.sin(i/70+t/900*(1+k*.3))*8);x.lineTo(W,H);x.fillStyle=`rgba(20,${80+k*30},${130+k*30},.25)`;x.fill()}}});
const css=document.createElement('style');css.textContent=`
.sea{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto}
#radar{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#06324a,#031018);border:2px solid #2aa9c9;box-shadow:0 0 40px rgba(42,169,201,.35) inset,0 0 30px rgba(42,169,201,.2)}
.cell{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(123,224,255,.6);background:radial-gradient(circle at 35% 30%,rgba(123,224,255,.35),rgba(3,20,32,.85));color:#dff6ff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}
.cell span{font-size:clamp(18px,6vw,32px);line-height:1}.cell small{font-size:11px;opacity:.8}
.cell:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 22px #7be0ff}
.cell.ship{border-color:#ffb454;box-shadow:0 0 22px #ffb454;background:radial-gradient(circle,#5a3a10,#1a0f04)}
.cell.hit{border-color:#7cf0c8;box-shadow:0 0 0 3px #7cf0c8,0 0 34px #7cf0c8;background:radial-gradient(circle,#0f5a45,#04140f)}
.cell.miss{border-color:#ff6b7a;box-shadow:0 0 0 3px #ff6b7a}
.cell.boom{animation:boom .6s}@keyframes boom{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1)}}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#9fd9ec;font-size:clamp(12px,3.2vw,16px);width:36%;line-height:1.35}
.ring{position:absolute;border-radius:50%;border:3px solid #7be0ff;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;pointer-events:none;animation:rg .8s ease-out forwards}
@keyframes rg{to{width:30%;opacity:0}}`;document.head.appendChild(css);
const cv=$('#radar'),cx=cv.getContext('2d');let ang=0;
(function sweep(){cx.clearRect(0,0,640,640);cx.strokeStyle='rgba(123,224,255,.25)';cx.lineWidth=1.5;for(const r of [80,160,240,310]){cx.beginPath();cx.arc(320,320,r,0,6.283);cx.stroke()}
 cx.beginPath();cx.moveTo(320,10);cx.lineTo(320,630);cx.moveTo(10,320);cx.lineTo(630,320);cx.stroke();
 const g=cx.createConicGradient(ang,320,320);g.addColorStop(0,'rgba(80,255,200,.45)');g.addColorStop(.12,'rgba(80,255,200,0)');g.addColorStop(1,'rgba(80,255,200,0)');cx.fillStyle=g;cx.beginPath();cx.arc(320,320,314,0,6.283);cx.fill();ang+=.025;requestAnimationFrame(sweep)})();
const cells=$('#cells');
for(let i=0;i<N;i++){const a=(i*36-90)*Math.PI/180;const b=document.createElement('button');b.type='button';b.className='cell';b.style.cssText=`left:${50+39*Math.cos(a)}%;top:${50+39*Math.sin(a)}%`;b.innerHTML=`<span>🌊</span><small>${i+1}</small>`;b.setAttribute('aria-label','Fire at cell '+(i+1));b.onclick=()=>fire(i);cells.appendChild(b)}
async function fire(i){if(busy||ship||!canPlay())return;busy=true;const st=randInt(N);ship=[st,(st+1)%N,(st+2)%N];shot=i;const win=ship.includes(i);
 [...cells.children].forEach(c=>c.disabled=true);const el=cells.children[i];const r=document.createElement('div');r.className='ring';r.style.left=el.style.left;r.style.top=el.style.top;$('#sea').appendChild(r);
 $('#ctr').innerHTML='Shell away...';await sleep(750);
 ship.forEach(k=>{cells.children[k].classList.add('ship');cells.children[k].firstChild.textContent='🚢'});
 if(win){el.classList.add('hit','boom');el.firstChild.textContent='💥'}else{el.classList.add('miss');el.firstChild.textContent='💦'}
 $('#ctr').innerHTML=win?'Direct hit.':'Open water.<br>Ship was on '+ship.map(k=>k+1).join(', ');
 settle(win);showResult(win,win?'Your shot landed on the ship.':'Your shot landed in open water.');busy=false;setActions([['New round',next]]);$('#hint').textContent=''}
function next(){ship=null;shot=null;$('#result').style.display='none';[...cells.children].forEach(c=>{c.className='cell';c.disabled=false;c.firstChild.textContent='🌊'});$('#ctr').innerHTML='Tap a cell<br>to fire';setActions([]);$('#hint').textContent=`Firing costs ${STAKE} credits.`}
window.onReset=next;next();
</script></body></html>
